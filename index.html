<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自学者的练习站</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="nav">
        <h1>自学者的练习站</h1>
        <button id="themeToggle" aria-label="切换主题">🌙</button>
      </nav>
      <p>一个简洁的网站模板：介绍你是谁、你在学什么、你下一步要做什么。</p>
      <a class="cta" href="#contact">开始行动</a>
    </header>

    <main>
      <section class="card-grid" id="features">
        <article class="card">
          <h2>目标清晰</h2>
          <p>把长期目标拆成每周目标，降低行动门槛。</p>
        </article>
        <article class="card">
          <h2>持续记录</h2>
          <p>每天记录 10 分钟学习笔记，积累复利。</p>
        </article>
        <article class="card">
          <h2>复盘迭代</h2>
          <p>每周复盘一次：做对了什么、下周改什么。</p>
        </article>
      </section>

      <section class="contact" id="contact">
        <h2>联系我</h2>
        <form>
          <label>
            你的名字
            <input type="text" placeholder="请输入名字" required />
          </label>
          <label>
            你的邮箱
            <input type="email" placeholder="name@example.com" required />
          </label>
          <label>
            留言
            <textarea rows="4" placeholder="你想一起学习什么？"></textarea>
          </label>
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <footer>
      <small>© 2026 自学者练习项目 · Built with HTML/CSS/JS</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
